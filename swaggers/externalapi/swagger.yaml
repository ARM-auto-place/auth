openapi: 3.0.0
servers:
    - {}
paths:
    /api/auth/v1/checkCode:
        get:
            tags:
                - ExternalAPI
            summary: Проверка кода верефикации
            description: Проверка кода верефикации
            parameters:
                - in: query
                  name: code
                  schema:
                    type: string
                - in: cookie
                  name: x-user-id
                  required: true
                  schema:
                    type: string
                    format: uuid
            responses:
                "200":
                    description: Successful operation
                "402":
                    description: Payment Required
                "403":
                    description: Forbidden
                "405":
                    description: Method Not Allowed
                "500":
                    description: Internal Server Error
    /api/auth/v1/register:
        post:
            tags:
                - ExternalAPI
            summary: Регистрация пользователя
            description: Регистрация пользователя
            parameters:
                - in: query
                  name: email
                  schema:
                    type: string
                - in: query
                  name: password
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful operation
                "402":
                    description: Payment Required
                "403":
                    description: Forbidden
                "405":
                    description: Method Not Allowed
                "500":
                    description: Internal Server Error
components:
    schemas:
        requestExternalAPICheckCode:
            type: object
        requestExternalAPIUserRegister:
            type: object
        responseExternalAPICheckCode:
            type: object
        responseExternalAPIUserRegister:
            type: object
            required:
                - userID
            properties:
                userID:
                    type: string
                    format: uuid
            description: Регистрация пользователя

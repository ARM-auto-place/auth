                                type: object
                                properties:
                                    additionalErrors:
                                        description: Текст ошибки, при ответе, со статус кодом 403, не указывается
                                    data: {}
                                    error:
                                        type: boolean
                                        example: true
                                        description: Флаг показывающий, что ответ пришел с ошибкой
                                    errorText:
                                        type: string
                                        example: content.api.errors.payApi.methodNotAllowed
                                        description: Заголовок ошибки
                "500":
                    description: Internal Server Error
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    additionalErrors:
                                        description: Текст ошибки, при ответе, со статус кодом 403, не указывается
                                    data: {}
                                    error:
                                        type: boolean
                                        example: true
                                        description: Флаг показывающий, что ответ пришел с ошибкой
                                    errorText:
                                        type: string
                                        example: content.api.errors.payApi.internalError
                                        description: Заголовок ошибки
components:
    schemas:
        requestExternalAPICheckCode:
            type: object
        requestExternalAPIUserRegister:
            type: object
        responseExternalAPICheckCode:
            type: object
        responseExternalAPIUserRegister:
            type: object
            required:
                - userID
            properties:
                userID:
                    type: string
                    format: uuid
            description: Регистрация пользователя

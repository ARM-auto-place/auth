openapi: 3.0.0
servers:
    - {}
paths:
    /api/auth/v1/checkCode:
        get:
            tags:
                - ExternalAPI
            summary: Проверка кода верефикации
            description: Проверка кода верефикации
            parameters:
                - in: query
                  name: code
                  schema:
                    type: string
                - in: cookie
                  name: x-user-id
                  required: true
                  schema:
                    type: string
                    format: uuid
            responses:
                "200":
                    description: Successful operation
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    additionalErrors: {}
                                    data:
                                        example: true
                                    error:
                                        type: boolean
                                        example: false
                                        description: Флаг показывающий, что ответ пришел с ошибкой
                                    errorText:
                                        type: string
                "402":
                    description: Payment Required
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    additionalErrors:
                                        description: На балансе недостаточно средств
                                    data: {}
                                    error:
                                        type: boolean
                                        example: true
                                        description: Флаг показывающий, что ответ пришел с ошибкой
                                    errorText:
                                        type: string
                                        example: content.api.errors.payApi.notEnoughMoney
                                        description: Заголовок ошибки
                "403":
                    description: Forbidden
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    additionalErrors:
                                        description: Текст ошибки, при ответе, со статус кодом 403, не указывается
                                    data: {}
                                    error:
                                        type: boolean
                                        example: true
                                        description: Флаг показывающий, что ответ пришел с ошибкой
                                    errorText:
                                        type: string
                                        example: content.api.errors.payApi.accessDenied
                                        description: Заголовок ошибки
                "405":
                    description: Method Not Allowed
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    additionalErrors:
                                        description: Текст ошибки, при ответе, со статус кодом 403, не указывается
                                    data: {}
                                    error:
                                        type: boolean
                                        example: true
                                        description: Флаг показывающий, что ответ пришел с ошибкой
                                    errorText:
                                        type: string
                                        example: content.api.errors.payApi.methodNotAllowed
                                        description: Заголовок ошибки
                "500":
                    description: Internal Server Error
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    additionalErrors:
                                        description: Текст ошибки, при ответе, со статус кодом 403, не указывается
                                    data: {}
                                    error:
                                        type: boolean
                                        example: true
                                        description: Флаг показывающий, что ответ пришел с ошибкой
                                    errorText:
                                        type: string
                                        example: content.api.errors.payApi.internalError
                                        description: Заголовок ошибки
    /api/auth/v1/register:
        post:
            tags:
                - ExternalAPI
            summary: Регистрация пользователя
            description: Регистрация пользователя
            parameters:
                - in: query
                  name: email
                  schema:
                    type: string
                - in: query
                  name: password
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful operation
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    additionalErrors: {}
                                    data:
                                        example: true
                                    error:
